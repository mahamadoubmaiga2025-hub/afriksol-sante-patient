<!doctype html>

<head>

<body>
<div id="app"></div>
<noscript>Activez JavaScript pour utiliser AfrikSol Santé.</noscript>
<script src="i18n.js?v=19"></script>

<script src="backend.js?v=19"></script>
<script src="qrcode.min.js?v=19"></script>
<script src="app.js?v=19"></script>
<script>
/* Mises à jour automatiques et silencieuses : le service worker sait déjà
   s'activer immédiatement (skipWaiting + clients.claim dans sw.js) ; cette
   page-ci (1) vérifie activement les nouvelles versions — au démarrage,
   toutes les 30 minutes et à chaque retour au premier plan — au lieu
   d'attendre le rythme du navigateur, et (2) recharge la page dès qu'une
   nouvelle version prend le contrôle, sauf si l'utilisateur est en pleine
   action engageante (feuille de paiement ouverte, confirmation de
   rendez-vous, panier) : le rechargement est alors différé jusqu'à la
   prochaine navigation sûre. Aucun message n'est affiché. */
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',function(){
    var hadController = !!navigator.serviceWorker.controller;
    var pendingReload = false, reloading = false;
    function safeNow(){
      if(document.getElementById('sheet')) return false;
      var h = location.hash || '';
      return h.indexOf('#/book/5') !== 0 && h.indexOf('#/cart') !== 0;
    }
    function tryReload(){
      if(!pendingReload || reloading) return;
      if(!safeNow()) return;
      var last = 0;
      try{ last = +(sessionStorage.getItem('afk_sw_reload_at') || 0); }catch(e){}
      if(Date.now() - last < 60000) return; /* anti-boucle */
      reloading = true;
      try{ sessionStorage.setItem('afk_sw_reload_at', String(Date.now())); }catch(e){}
      location.reload();
    }
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!hadController) return; /* première installation : rien à recharger */
      pendingReload = true;
      tryReload();
    });
    window.addEventListener('hashchange', tryReload);
    setInterval(tryReload, 5000);
    navigator.serviceWorker.register('sw.js').then(function(reg){
      function check(){ reg.update().catch(function(){}); }
      check();
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') check(); });
      window.addEventListener('focus', check);
    }).catch(function(){});
  });
}
</script>
</body>
</html>
